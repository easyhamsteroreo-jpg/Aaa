<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Полицейский участок Kinderland</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #1e4b2e 0%, #0e2a1a 100%);
            font-family: 'Segoe UI', 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        /* Главный контейнер — как будто полицейский планшет */
        .police-container {
            max-width: 1300px;
            margin: 0 auto;
            background: #fef5e0;
            background-image: radial-gradient(circle at 10% 20%, rgba(255,245,200,0.6) 2%, transparent 2.5%);
            background-size: 28px 28px;
            border-radius: 60px 60px 40px 40px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
            border: 5px solid #ffcd7e;
        }

        /* Шапка с шерифом и звездой */
        .header {
            background: #2c3e66;
            background: linear-gradient(135deg, #1f2c46, #121d31);
            padding: 20px 25px;
            color: #ffecb3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 6px solid #f7b32b;
        }

        .badge {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .star {
            font-size: 48px;
            filter: drop-shadow(2px 2px 0 #b45f1b);
        }

        h1 {
            font-size: 1.9rem;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0 #00000055;
            font-weight: 800;
        }

        .kinder-sign {
            background: #f7b32b;
            color: #1f2c46;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #9b5e1a;
        }

        /* форма добавления */
        .form-card {
            background: #fffaf0;
            margin: 25px 25px 20px 25px;
            padding: 20px 25px;
            border-radius: 48px;
            box-shadow: 0 8px 0 #c29b4a;
            border: 1px solid #ffdd99;
        }

        .form-title {
            font-size: 1.7rem;
            font-weight: bold;
            color: #2c3e66;
            border-left: 12px solid #f7b32b;
            padding-left: 20px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-weight: bold;
            color: #2c3e66;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group select {
            padding: 12px 15px;
            border-radius: 60px;
            border: 2px solid #f0cf9c;
            background: white;
            font-size: 1rem;
            font-family: inherit;
            transition: 0.2s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #f7b32b;
            outline: none;
            box-shadow: 0 0 0 3px rgba(247,179,43,0.3);
        }

        .war-group {
            flex-direction: row;
            align-items: center;
            gap: 20px;
        }

        .war-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            cursor: pointer;
        }

        .war-group input {
            width: 22px;
            height: 22px;
            cursor: pointer;
        }

        .btn-add {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            margin-top: 10px;
            width: 100%;
            box-shadow: 0 5px 0 #1b5e20;
        }

        .btn-add:hover {
            background: #1b5e20;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #0a3b0e;
        }

        .btn-add:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0a3b0e;
        }

        /* панель управления списком */
        .list-tools {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin: 10px 25px 15px 25px;
            padding-bottom: 8px;
            border-bottom: 3px dashed #ffcd7e;
        }

        .list-title {
            font-size: 1.6rem;
            font-weight: bold;
            color: #1f2c46;
            background: #ffe0a3;
            display: inline-block;
            padding: 6px 25px;
            border-radius: 50px;
        }

        .stats {
            background: #d9c48b;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: bold;
            color: #1f2c46;
        }

        /* таблица / карточки */
        .people-table {
            margin: 0 25px 30px 25px;
            overflow-x: auto;
            border-radius: 32px;
            background: #f3ecd9;
            box-shadow: inset 0 1px 4px #0001, 0 6px 12px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: inherit;
        }

        th {
            background: #2c3e66;
            color: #ffecb3;
            padding: 14px 8px;
            font-size: 0.9rem;
            text-align: left;
            position: sticky;
            top: 0;
        }

        td {
            padding: 14px 8px;
            border-bottom: 1px solid #eeddbb;
            color: #2d2b1f;
            vertical-align: middle;
            background-color: #fffcf0;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .status-wanted { background: #dc2626; color: white; }
        .status-missing { background: #ea580c; color: white; }
        .status-tracking { background: #2b9348; color: white; }
        .war-yes { background: #7f2d2d; color: #ffd966; padding: 3px 10px; border-radius: 30px; font-size:0.8rem; display: inline-block;}
        .war-no { background: #3f6b3a; color: #e4f5cf; padding: 3px 10px; border-radius: 30px; display: inline-block;}

        .btn-remove {
            background: #b91c1c;
            border: none;
            color: white;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s linear;
            font-family: inherit;
            font-size: 0.8rem;
        }

        .btn-remove:hover {
            background: #7f1a1a;
            transform: scale(1.02);
        }

        .empty-row td {
            text-align: center;
            padding: 48px;
            font-size: 1.3rem;
            color: #aa8b54;
            background: #fff7e8;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #1f2c46;
            color: #b9c7da;
            font-size: 0.7rem;
            border-top: 3px solid #f7b32b;
        }

        @media (max-width: 700px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
            th, td {
                font-size: 0.75rem;
                padding: 8px 4px;
            }
            .btn-remove {
                padding: 4px 10px;
            }
            .form-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
<div class="police-container">
    <div class="header">
        <div class="badge">
            <div class="star">⭐👮‍♂️🚔</div>
            <h1>KINDERLAND POLIZEI</h1>
        </div>
        <div class="kinder-sign">ОМРУТ • розыск детей</div>
    </div>

    <div class="form-card">
        <div class="form-title">📝 Внести данные в электронный журнал</div>
        <div class="form-grid">
            <div class="input-group">
                <label>👤 Полное имя</label>
                <input type="text" id="nameInput" placeholder="Например: Карина Гуня" autocomplete="off">
            </div>
            <div class="input-group">
                <label>🎂 Возраст (лет)</label>
                <input type="number" id="ageInput" placeholder="9" value="9" step="1" min="0">
            </div>
            <div class="input-group">
                <label>📞 Номер телефона</label>
                <input type="tel" id="phoneInput" placeholder="+380 00 123 45 67">
            </div>
            <div class="input-group war-group">
                <label>⚔️ На войне?</label>
                <label><input type="radio" name="warStatus" value="Да" id="warYes"> Да</label>
                <label><input type="radio" name="warStatus" value="Нет" id="warNo" checked> Нет</label>
            </div>
            <div class="input-group">
                <label>🚨 Статус в системе</label>
                <select id="categorySelect">
                    <option value="В розыске">🔍 В розыске</option>
                    <option value="Пропал">⚠️ Пропал</option>
                    <option value="Отслеживается">🕵️ Отслеживается</option>
                </select>
            </div>
        </div>
        <button class="btn-add" id="addPersonBtn">➕ Добавить в реестр</button>
    </div>

    <div class="list-tools">
        <span class="list-title">📋 СПИСОК ЛИЦ</span>
        <span class="stats" id="statsCounter">Всего: 0</span>
    </div>

    <div class="people-table">
        <table id="peopleTable">
            <thead>
                <tr>
                    <th>Имя</th><th>Возраст</th><th>Телефон</th><th>На войне</th><th>Категория</th><th>Действие</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- динамические строки -->
            </tbody>
        </table>
    </div>
    <footer>
        🧸 Полицейский участок Kinderland • Вносить и выносить из списка • Данные о розыске и пропавших
    </footer>
</div>

<script>
    // Массив для хранения записей
    let persons = [];

    // Элементы DOM
    const nameInput = document.getElementById('nameInput');
    const ageInput = document.getElementById('ageInput');
    const phoneInput = document.getElementById('phoneInput');
    const warYes = document.getElementById('warYes');
    const warNo = document.getElementById('warNo');
    const categorySelect = document.getElementById('categorySelect');
    const addBtn = document.getElementById('addPersonBtn');
    const tableBody = document.getElementById('tableBody');
    const statsCounter = document.getElementById('statsCounter');

    // Функция рендеринга таблицы
    function renderTable() {
        if (!tableBody) return;
        tableBody.innerHTML = '';
        if (persons.length === 0) {
            const emptyRow = document.createElement('tr');
            emptyRow.className = 'empty-row';
            emptyRow.innerHTML = `<td colspan="6">🚸 В базе пока никого нет. Добавьте пропавшего, в розыске или отслеживаемого 🚸</td>`;
            tableBody.appendChild(emptyRow);
            statsCounter.innerText = `Всего: 0`;
            return;
        }

        for (let i = 0; i < persons.length; i++) {
            const p = persons[i];
            const row = document.createElement('tr');

            // Имя
            const nameCell = document.createElement('td');
            nameCell.textContent = p.name;
            row.appendChild(nameCell);

            // Возраст
            const ageCell = document.createElement('td');
            ageCell.textContent = p.age !== undefined ? `${p.age} лет` : '—';
            row.appendChild(ageCell);

            // Телефон
            const phoneCell = document.createElement('td');
            phoneCell.textContent = p.phone || 'нет номера';
            row.appendChild(phoneCell);

            // На войне (с бейджиком)
            const warCell = document.createElement('td');
            const warSpan = document.createElement('span');
            warSpan.className = p.war === 'Да' ? 'war-yes' : 'war-no';
            warSpan.textContent = p.war === 'Да' ? '⚔️ На войне' : '🌿 Мирное';
            warCell.appendChild(warSpan);
            row.appendChild(warCell);

            // Категория с цветным бейджиком
            const catCell = document.createElement('td');
            let catClass = '';
            if (p.category === 'В розыске') catClass = 'status-wanted';
            else if (p.category === 'Пропал') catClass = 'status-missing';
            else if (p.category === 'Отслеживается') catClass = 'status-tracking';
            const catSpan = document.createElement('span');
            catSpan.className = `status-badge ${catClass}`;
            let catIcon = '';
            if (p.category === 'В розыске') catIcon = '🔎 ';
            else if (p.category === 'Пропал') catIcon = '❓ ';
            else catIcon = '🛡️ ';
            catSpan.textContent = catIcon + p.category;
            catCell.appendChild(catSpan);
            row.appendChild(catCell);

            // Кнопка "Вынести" (удалить из списка)
            const actionCell = document.createElement('td');
            const removeBtn = document.createElement('button');
            removeBtn.textContent = '✖ Вынести';
            removeBtn.className = 'btn-remove';
            removeBtn.addEventListener('click', (function(index) {
                return function() { removePerson(index); };
            })(i));
            actionCell.appendChild(removeBtn);
            row.appendChild(actionCell);

            tableBody.appendChild(row);
        }
        statsCounter.innerText = `Всего: ${persons.length}`;
    }

    // Функция удаления (вынос из списка)
    function removePerson(index) {
        if (index >= 0 && index < persons.length) {
            const removed = persons[index];
            persons.splice(index, 1);
            renderTable();
            // можно добавить оповещение, но не обязательно
            console.log(`Вынесен из списка: ${removed.name}`);
        }
    }

    // Функция добавления нового человека
    function addPerson() {
        // получаем имя, обрезаем пробелы
        let fullName = nameInput.value.trim();
        if (fullName === "") {
            alert("Пожалуйста, укажите имя человека!");
            return;
        }

        let age = parseInt(ageInput.value);
        if (isNaN(age)) age = 0;

        let phone = phoneInput.value.trim();
        if (phone === "") phone = "не указан";

        let warStatus = warYes.checked ? "Да" : "Нет";
        let category = categorySelect.value;

        // Создаём объект
        const newPerson = {
            name: fullName,
            age: age,
            phone: phone,
            war: warStatus,
            category: category
        };

        persons.push(newPerson);
        renderTable();

        // Очищаем поля (имя оставляем для удобства, но лучше очистить имя, возраст сбросить?)
        nameInput.value = "";
        ageInput.value = 9;
        phoneInput.value = "";
        warNo.checked = true;  // по умолчанию "Нет"
        categorySelect.value = "В розыске";
        nameInput.focus();
    }

    // Инициализация: добавим демо-пример "Карина Гуня, 9 лет, в розыске"
    function initDemoData() {
        // чтобы не дублировать при перезагрузке, добавляем только если массив пуст
        if (persons.length === 0) {
            persons.push({
                name: "Карина Гуня",
                age: 9,
                phone: "+49123456789",
                war: "Нет",
                category: "В розыске"
            });
            // добавим еще пару примеров, чтобы показать разные статусы
            persons.push({
                name: "Максим Добрый",
                age: 12,
                phone: "+380991112233",
                war: "Да",
                category: "Пропал"
            });
            persons.push({
                name: "Алина Светлая",
                age: 7,
                phone: "+49152234567",
                war: "Нет",
                category: "Отслеживается"
            });
            renderTable();
        }
    }

    // Событие на кнопку добавить
    addBtn.addEventListener('click', addPerson);

    // Также добавим возможность нажатия Enter в поле имени
    nameInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            addPerson();
        }
    });
    phoneInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addPerson();
    });

    // Загрузка страницы
    initDemoData();
</script>
</body>
</html>
