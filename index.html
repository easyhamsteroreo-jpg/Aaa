<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Easy Post — Рабочее место сотрудника</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: #f2f2f6;
            padding: 0 0 70px 0;
        }
        /* Мобильная карточка */
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        /* Хедер сотрудника */
        .staff-header {
            background: #1a5c9e;
            color: white;
            padding: 24px 16px 16px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }
        .staff-header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .badge {
            background: #ffcd3c;
            color: #1a3e6f;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-top: 8px;
        }
        /* Основные секции */
        .section {
            background: white;
            margin: 16px;
            padding: 16px;
            border-radius: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid #e9ecef;
        }
        .section-title {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #1a5c9e;
            padding-left: 12px;
        }
        /* Поля и кнопки */
        .input-group {
            margin-bottom: 16px;
        }
        label {
            font-size: 13px;
            font-weight: 500;
            color: #3a3a44;
            display: block;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #d4d4d8;
            border-radius: 14px;
            background: #f9fafb;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #1a5c9e;
            background: white;
        }
        .btn {
            background: #1a5c9e;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
            margin-top: 8px;
        }
        .btn-secondary {
            background: #eef2f9;
            color: #1a5c9e;
            border: 1px solid #cbd5e1;
        }
        .btn-danger {
            background: #dc2626;
        }
        .btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
        /* Карточка заказа */
        .order-card {
            background: #f8fafc;
            border-radius: 20px;
            padding: 15px;
            margin-top: 12px;
            border: 1px solid #e2e8f0;
        }
        .order-id {
            font-family: monospace;
            font-weight: bold;
            font-size: 16px;
            background: #eef2ff;
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-in { background: #fee2e2; color: #b91c1c; }
        .status-out { background: #dcfce7; color: #15803d; }
        .grid-2 {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .grid-2 .btn { margin-top: 0; }
        footer {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            padding: 20px;
        }
        /* Адаптация под темный режим? Не требуется, но оставим светлый */
        @media (max-width: 480px) {
            .section { margin: 12px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="staff-header">
        <h1>📦 Easy Post</h1>
        <p style="opacity:0.9; font-size:14px;">Рабочее место сотрудника</p>
        <div class="badge">Смена: Активна</div>
    </div>

    <!-- Секция выбора действия -->
    <div class="section">
        <div class="section-title">⚡ Операции с посылками</div>
        <div class="input-group">
            <label>📱 Сканировать / Ввести № накладной</label>
            <input type="text" id="trackInput" placeholder="Наведите камеру или введите EPXXXXXXXXXUA" value="EP240512001UA">
        </div>
        <div class="grid-2">
            <button class="btn" id="findParcelBtn">🔍 Найти</button>
            <button class="btn btn-secondary" id="simulateScanBtn">📷 Скан (демо)</button>
        </div>
        <div id="parcelCard" style="margin-top: 16px;">
            <!-- Динамическая карточка посылки будет появляться здесь -->
            <div class="order-card" style="background:#f1f5f9; text-align:center; color:#475569;">
                Введите или отсканируйте штрих-код
            </div>
        </div>
    </div>

    <!-- Секция приёма и выдачи -->
    <div class="section" id="actionSection" style="display: none;">
        <div class="section-title">🔄 Изменение статуса</div>
        <div id="actionButtons">
            <!-- Кнопки будут подставлены динамически -->
        </div>
    </div>

    <!-- Секция журнала (история) -->
    <div class="section">
        <div class="section-title">📋 Журнал операций (смена)</div>
        <div id="logList" style="max-height: 220px; overflow-y: auto;">
            <div style="color:#94a3b8; text-align:center; padding:12px;">Здесь будут действия сотрудника</div>
        </div>
        <button class="btn btn-secondary" id="clearLogBtn" style="margin-top: 12px;">🗑 Очистить историю</button>
    </div>
    <footer>Easy Post — внутренний инструмент / демо-версия</footer>
</div>

<script>
    // Хранилище "посылок" в памяти (имитация БД)
    let parcelsDB = [
        { id: "EP240512001UA", status: "На складі", receiver: "Іванченко О.", dateIn: "2026-05-07 09:23", dateOut: null },
        { id: "EP240512089UA", status: "Очікує видачі", receiver: "Мельник А.", dateIn: "2026-05-06 14:10", dateOut: null },
        { id: "EP240511455UA", status: "Видано", receiver: "Коваленко С.", dateIn: "2026-05-05 11:45", dateOut: "2026-05-06 16:20" }
    ];
    
    // Журнал (действия за смену)
    let actionLog = [];

    // DOM элементы
    const trackInput = document.getElementById('trackInput');
    const findBtn = document.getElementById('findParcelBtn');
    const simulateScanBtn = document.getElementById('simulateScanBtn');
    const parcelCardDiv = document.getElementById('parcelCard');
    const actionSection = document.getElementById('actionSection');
    const actionButtonsDiv = document.getElementById('actionButtons');
    const logListDiv = document.getElementById('logList');
    const clearLogBtn = document.getElementById('clearLogBtn');

    // Функция рендеринга журнала
    function renderLog() {
        if (actionLog.length === 0) {
            logListDiv.innerHTML = '<div style="color:#94a3b8; text-align:center; padding:12px;">Нет операций за смену</div>';
            return;
        }
        let html = '';
        for (let i = actionLog.length-1; i >= 0; i--) {
            const log = actionLog[i];
            html += `<div style="padding: 10px 0; border-bottom:1px solid #eef2f6; font-size:14px;">
                        <span style="font-weight:500;">${log.time}</span> — ${log.text}
                     </div>`;
        }
        logListDiv.innerHTML = html;
    }

    function addLogMessage(message) {
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
        actionLog.push({ time: timeStr, text: message });
        renderLog();
    }

    // Функция отображения карточки посылки и кнопок действий
    function renderParcelCard(parcel) {
        if (!parcel) {
            parcelCardDiv.innerHTML = `<div class="order-card" style="background:#fee2e2; border-color:#fecaca;">
                                        ❌ Посылка не найдена. Проверьте номер.
                                       </div>`;
            actionSection.style.display = 'none';
            return;
        }
        
        // Определяем статус по-русски
        let statusText = "";
        let statusClass = "";
        if (parcel.status === "На складі") { statusText = "📥 Принято / На складе"; statusClass = "status-in"; }
        else if (parcel.status === "Очікує видачі") { statusText = "⏳ Ожидает выдачи"; statusClass = "status-out"; }
        else if (parcel.status === "Видано") { statusText = "✅ Выдано получателю"; statusClass = "status-in"; }
        else { statusText = parcel.status; statusClass = ""; }
        
        let cardHtml = `<div class="order-card">
                            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
                                <span class="order-id">${parcel.id}</span>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <div style="margin-top: 12px;">
                                <div>👤 Получатель: <strong>${parcel.receiver || "—"}</strong></div>
                                <div>📅 Поступление: ${parcel.dateIn || "—"}</div>
                                ${parcel.dateOut ? `<div>🚚 Выдача: ${parcel.dateOut}</div>` : ''}
                            </div>
                        </div>`;
        parcelCardDiv.innerHTML = cardHtml;
        
        // Генерация кнопок в зависимости от текущего статуса
        let btnsHtml = "";
        const now = new Date();
        const dateString = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        
        if (parcel.status === "На складі") {
            btnsHtml = `<button class="btn" id="actionToWait">📦 Перевести в «Ожидает выдачи»</button>`;
        } else if (parcel.status === "Очікує видачі") {
            btnsHtml = `<button class="btn" id="actionToGiveOut">✍️ Выдать получателю</button>`;
        } else if (parcel.status === "Видано") {
            btnsHtml = `<button class="btn btn-secondary" disabled style="opacity:0.6;">🔒 Посылка уже выдана</button>`;
        } else {
            btnsHtml = `<button class="btn btn-secondary" disabled>Статус не определён</button>`;
        }
        
        actionButtonsDiv.innerHTML = btnsHtml;
        actionSection.style.display = 'block';
        
        // Навешиваем обработчики на динамические кнопки
        if (parcel.status === "На складі") {
            const toWaitBtn = document.getElementById('actionToWait');
            if (toWaitBtn) {
                toWaitBtn.onclick = () => {
                    // обновляем статус в БД
                    const index = parcelsDB.findIndex(p => p.id === parcel.id);
                    if (index !== -1) {
                        parcelsDB[index].status = "Очікує видачі";
                        addLogMessage(`📦 Посылка ${parcel.id} переведена в статус "Ожидает выдачи"`);
                        // Перерендерим карточку
                        renderParcelCard(parcelsDB[index]);
                    }
                };
            }
        } else if (parcel.status === "Очікує видачі") {
            const giveOutBtn = document.getElementById('actionToGiveOut');
            if (giveOutBtn) {
                giveOutBtn.onclick = () => {
                    const index = parcelsDB.findIndex(p => p.id === parcel.id);
                    if (index !== -1) {
                        const nowTime = `${new Date().getFullYear()}-${(new Date().getMonth()+1).toString().padStart(2,'0')}-${new Date().getDate().toString().padStart(2,'0')} ${new Date().getHours().toString().padStart(2,'0')}:${new Date().getMinutes().toString().padStart(2,'0')}`;
                        parcelsDB[index].status = "Видано";
                        parcelsDB[index].dateOut = nowTime;
                        addLogMessage(`✅ Посылка ${parcel.id} ВЫДАНА получателю ${parcelsDB[index].receiver}`);
                        renderParcelCard(parcelsDB[index]);
                    }
                };
            }
        }
    }
    
    // Функция поиска посылки по номеру
    function findParcelById(parcelId) {
        if (!parcelId) return null;
        return parcelsDB.find(p => p.id === parcelId.trim());
    }
    
    function handleFindParcel() {
        const rawId = trackInput.value.trim();
        if (rawId === "") {
            parcelCardDiv.innerHTML = `<div class="order-card" style="background:#fff3e3;">⚠️ Введите номер накладной</div>`;
            actionSection.style.display = 'none';
            return;
        }
        const parcel = findParcelById(rawId);
        if (parcel) {
            renderParcelCard(parcel);
            addLogMessage(`🔎 Поиск: ${parcel.id} — текущий статус: ${parcel.status}`);
        } else {
            parcelCardDiv.innerHTML = `<div class="order-card" style="background:#fee2e2;">❌ Посылка ${rawId} не найдена в системе.</div>`;
            actionSection.style.display = 'none';
            addLogMessage(`⚠️ Ненайденная посылка: ${rawId}`);
        }
    }
    
    // Имитация сканирования (добавляет префикс)
    function simulateScan() {
        const demoScans = ["EP240512001UA", "EP240512089UA", "EP240511455UA", "EP987654321UA"];
        const randomScan = demoScans[Math.floor(Math.random() * demoScans.length)];
        trackInput.value = randomScan;
        // сразу вызываем поиск:
        handleFindParcel();
        addLogMessage(`📷 Сканирование (демо): ${randomScan}`);
    }
    
    // Очистка журнала
    clearLogBtn.addEventListener('click', () => {
        actionLog = [];
        renderLog();
        addLogMessage("🗑️ Журнал операций очищен");
    });
    
    // События
    findBtn.addEventListener('click', handleFindParcel);
    simulateScanBtn.addEventListener('click', simulateScan);
    
    // Также enter в поле ввода
    trackInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleFindParcel();
    });
    
    // Инициализация - отображаем подсказку
    renderLog();
    addLogMessage("🚀 Смена начата. Сотрудник авторизован (демо).");
</script>
</body>
</html>
