<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Полицейский участок Kinderland — розыск</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #1e4b2e;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: #fef5e0;
            border-radius: 40px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 4px solid #ffcd7e;
        }
        .header {
            background: #1f2c46;
            padding: 18px 25px;
            color: #ffecb3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 5px solid #f7b32b;
        }
        .header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        .badge {
            background: #f7b32b;
            color: #1f2c46;
            padding: 6px 18px;
            border-radius: 50px;
            font-weight: bold;
        }
        .form-card {
            background: #fffaf0;
            margin: 25px;
            padding: 20px 25px;
            border-radius: 40px;
            box-shadow: 0 5px 0 #c29b4a;
        }
        .form-title {
            font-size: 1.6rem;
            font-weight: bold;
            color: #2c3e66;
            border-left: 10px solid #f7b32b;
            padding-left: 18px;
            margin-bottom: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-weight: 600;
            color: #2c3e66;
        }
        .input-group input, .input-group select {
            padding: 10px 14px;
            border-radius: 60px;
            border: 2px solid #f0cf9c;
            background: white;
            font-size: 1rem;
            font-family: inherit;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #f7b32b;
            outline: none;
            background-color: #fffef7;
        }
        .war-options {
            display: flex;
            gap: 25px;
            align-items: center;
            margin-top: 6px;
        }
        .war-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
        }
        .war-options input {
            width: 18px;
            height: 18px;
            margin: 0;
        }
        .btn-add {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            transition: 0.1s;
            margin-top: 8px;
            box-shadow: 0 4px 0 #1b5e20;
        }
        .btn-add:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1b5e20;
        }
        .list-tools {
            display: flex;
            justify-content: space-between;
            margin: 10px 25px 10px 25px;
            align-items: baseline;
        }
        .list-title {
            font-size: 1.5rem;
            font-weight: bold;
            background: #ffe0a3;
            padding: 5px 20px;
            border-radius: 30px;
        }
        .stats {
            background: #d9c48b;
            padding: 5px 16px;
            border-radius: 30px;
            font-weight: bold;
        }
        .table-wrapper {
            margin: 0 25px 30px 25px;
            overflow-x: auto;
            background: #f3ecd9;
            border-radius: 28px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: inherit;
        }
        th {
            background: #2c3e66;
            color: #ffecb3;
            padding: 12px 8px;
            text-align: left;
        }
        td {
            padding: 12px 8px;
            border-bottom: 1px solid #eeddbb;
            background: #fffcf0;
            vertical-align: middle;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .wanted { background: #dc2626; color: white; }
        .missing { background: #ea580c; color: white; }
        .tracking { background: #2b9348; color: white; }
        .war-yes { background: #7f2d2d; color: #ffd966; padding: 3px 12px; border-radius: 30px; }
        .war-no { background: #3f6b3a; color: #e4f5cf; padding: 3px 12px; border-radius: 30px; }
        .btn-remove {
            background: #b91c1c;
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        .empty-row td {
            text-align: center;
            padding: 48px;
            font-size: 1.2rem;
            color: #aa8b54;
        }
        footer {
            text-align: center;
            padding: 12px;
            background: #1f2c46;
            color: #b9c7da;
            font-size: 0.7rem;
        }
        @media (max-width: 700px) {
            .form-grid { grid-template-columns: 1fr; }
            th, td { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🚔 KINDERLAND POLIZEI</h1>
        <div class="badge">ОМРУТ • розыск</div>
    </div>

    <div class="form-card">
        <div class="form-title">📝 Внести данные</div>
        <div class="form-grid">
            <div class="input-group">
                <label>👤 Полное имя</label>
                <input type="text" id="fullName" placeholder="Карина Гуня" autocomplete="off">
            </div>
            <div class="input-group">
                <label>🎂 Возраст (лет)</label>
                <input type="number" id="age" value="9" step="1" min="0">
            </div>
            <div class="input-group">
                <label>📞 Номер телефона</label>
                <input type="text" id="phone" placeholder="+380 00 123 45 67">
            </div>
            <div class="input-group">
                <label>⚔️ На войне?</label>
                <div class="war-options">
                    <label><input type="radio" name="warStatus" value="Да"> Да</label>
                    <label><input type="radio" name="warStatus" value="Нет" checked> Нет</label>
