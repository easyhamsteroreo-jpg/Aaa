<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Easy Post — с передачей по ссылке</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui; background: #f2f2f6; padding: 16px; }
        .container { max-width: 500px; margin: auto; }
        .card { background: white; border-radius: 20px; padding: 16px; margin-bottom: 16px; }
        input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 14px; border: 1px solid #ccc; }
        button { background: #1a5c9e; color: white; font-weight: bold; }
        .parcel-item { background: #f8fafc; border-radius: 16px; padding: 12px; margin-top: 8px; }
    </style>
</head>
<body>
<div class="container" id="app"></div>
<script>
    let currentUser = null;
    let parcels = JSON.parse(localStorage.getItem('parcels') || '[]');
    let users = JSON.parse(localStorage.getItem('users') || '[]');

    function save() {
        localStorage.setItem('parcels', JSON.stringify(parcels));
        localStorage.setItem('users', JSON.stringify(users));
    }

    function generateId() {
        return 'EP' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substr(2, 4).toUpperCase();
    }

    // ----- ЭКСПОРТ ВСЕХ ДАННЫХ В ОДНУ ССЫЛКУ -----
    function shareAllData() {
        const data = { parcels, users };
        const json = JSON.stringify(data);
        // Кодируем в компактную ссылку
        const encoded = encodeURIComponent(json);
        // Можно создать маленький html с авто-восстановлением
        const restoreHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Восстановить Easy Post</title><script>
            const data = JSON.parse(decodeURIComponent("${encoded}"));
            localStorage.setItem('parcels', JSON.stringify(data.parcels));
            localStorage.setItem('users', JSON.stringify(data.users));
            alert('Данные восстановлены! Перейдите в приложение.');
            location.href = 'index.html';
        <\/script><body>Восстановление...</body></html>`;
        const blob = new Blob([restoreHtml], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        // Показываем кнопку "Поделиться" через системное меню
        if (navigator.share) {
            navigator.share({
                title: 'Easy Post - резервная копия',
                files: [new File([blob], 'easy_post_restore.html', { type: 'text/html' })]
            }).catch(() => alert('Не удалось поделиться'));
        } else {
            // Если поделиться нельзя, копируем ссылку
            prompt('Отправьте эту ссылку на другой телефон:', url);
        }
    }

    // ----- Логин и роли (максимально упрощён) -----
    function renderLogin() {
        document.getElementById('app').innerHTML = `
            <div class="card">
                <h3>Вход</h3>
                <input type="tel" id="phone" placeholder="+380XXXXXXXXX" value="+380991234567">
                <button id="sendCode">Далее</button>
            </div>
        `;
        document.getElementById('sendCode').onclick = () => {
            let phone = document.getElementById('phone').value.trim();
            if (!phone.startsWith('+380')) return alert('+380...');
            let user = users.find(u => u.phone === phone);
            if (!user) {
                user = { phone, role: null };
                users.push(user);
                save();
            }
            currentUser = user;
            if (user.role) renderRolePanel(user.role);
            else renderChooseRole();
        };
    }

    function renderChooseRole() {
        document.getElementById('app').innerHTML = `
            <div class="card">
                <h3>Кто вы?</h3>
                <button id="roleUser">Пользователь</button>
                <button id="roleWorker">Работник почты</button>
                <button id="roleCourier">Курьер</button>
            </div>
        `;
        document.
        if (p) { p.status = newStatus; save(); refresh(); }
        };
        document.getElementById('shareBtn').onclick = () => shareAllData();
        document.getElementById('logout').onclick = () => { currentUser = null; renderLogin(); };
        refresh();
    }

    function renderCourier() {
        let html = `<div class="card"><h3>Доставка</h3><div id="list"></div></div>
                    <button id="shareBtn">📤 Отправить данные</button>
                    <button id="logout">Выйти</button>`;
        document.getElementById('app').innerHTML = html;
        function refresh() {
            let courier = parcels.filter(p => p.status === 'courier');
            let available = parcels.filter(p => p.status === 'office');
            let container = document.getElementById('list');
            container.innerHTML = `
                <h4>Мои посылки (у курьера)</h4>
                ${courier.map(p => `
                    <div class="parcel-item">
                        ${p.id} — ${p.to}<br>
                        📍 ${p.courierLocation || 'не указано'}<br>
                        <button onclick="updateLoc('${p.id}')">📍 Обновить местоположение</button>
                        <button onclick="deliver('${p.id}')">✅ Доставлено</button>
                    </div>
                `).join('') || 'Нет'}
                <h4>Посылки на складе (забрать)</h4>
                ${available.map(p => `
                    <div class="parcel-item">
                        ${p.id} — ${p.to}<br>
                        <button onclick="take('${p.id}')">🚚 Забрать</button>
                    </div>
                `).join('') || 'Нет'}
            `;
        }
        window.updateLoc = (id) => {
            let loc = prompt('Местоположение:', 'Киев, склад');
            if (loc) { let p = parcels.find(p => p.id === id); if (p) { p.courierLocation = loc; save(); refresh(); } }
        };
        window.deliver = (id) => {
            if (confirm('Доставлена?')) { let p = parcels.find(p => p.id === id); if (p) { p.status = 'delivered'; save(); refresh(); } }
        };
        window.take = (id) => {
            let p = parcels.find(p => p.id === id);
            if (p) { p.status = 'courier'; p.courierLocation = 'Забрана курьером'; save(); refresh(); }
        };
        document.getElementById('shareBtn').onclick = () => shareAllData();
        document.getElementById('logout').onclick = () => { currentUser = null; renderLogin(); };
        refresh();
    }

    renderLogin();
</script>
</body>
</html>
